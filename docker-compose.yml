services:
  mcp-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    pull_policy: build
    image: mcp-client:latest
    platform: linux/amd64
    ports:
      - "8081:8080"         # Expose port 8080 of the container on port 8081 of the host
    depends_on:
      - mcp-server
    networks:
      - ai-network

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: mcp-server-1 
    pull_policy: build
    image: mcp-server:latest
    platform: linux/amd64
    stdin_open: true  # Enable interactive mode for stdio
    tty: true         # Allocate a pseudo-TTY
    networks:
      - ai-network

  chat-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    pull_policy: build
    image: chat-ui:latest
    platform: linux/amd64
    ports:
      - "5001:8081"         # Expose Streamlit on port 5001 (to avoid conflict with MCP client)
    depends_on:
      - mcp-client
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge